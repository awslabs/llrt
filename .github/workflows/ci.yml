name: LLRT CI
on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

# Only run on the latest ref
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: | #create mock js files
          mkdir -p bundle/js
          for i in {1..5}; do
            echo "console.log(123);" > "bundle/js/test$i.js"
          done
          cargo clippy --all-targets -- -D warnings
  wpt:
    needs:
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout WPT submodule
        run: git submodule update --init --checkout --depth 1 --force wpt
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: lts/*
      - name: Install Linux dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install make nodejs tzdata-legacy
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Run WPT
        run: make check-wpt
  size:
    needs:
      - check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            release: x64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            release: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout submodules
        run: git submodule update --init --checkout
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: lts/*
      - name: Install Linux dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install make nodejs zstd zip
          sudo snap install zig --classic --beta
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly-2026-08-26
          target: ${{ matrix.target }}
          components: rust-src
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build binaries
        run: |
          make libs-${{ matrix.release }}
          make llrt-linux-${{ matrix.release }}.zip
          linux=$(stat -c%s "target/${{ matrix.target }}/release/llrt")
          make llrt-lambda-${{ matrix.release }}.zip
          compressed=$(stat -c%s "target/${{ matrix.target }}/release/bootstrap")
          make llrt-container-${{ matrix.release }}
          lambda=$(stat -c%s "llrt-container-${{ matrix.release }}")
          mkdir -p sizes
          cat > "sizes/sizes-${{ matrix.arch }}.json" <<EOF
          {
            "llrt (linux) ${{ matrix.arch }}": $linux,
            "llrt (lambda compressed) ${{ matrix.arch }}": $compressed,
            "llrt (lambda) ${{ matrix.arch }}": $lambda
          }
          EOF
      - name: Upload sizes
        uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.arch }}
          path: sizes/sizes-${{ matrix.arch }}.json
  size-report:
    needs:
      - size
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download sizes
        uses: actions/download-artifact@v7
        with:
          pattern: sizes-*
          path: current
          merge-multiple: true
      - name: Download baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name size-baseline --dir baseline
      - name: Report
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/size-diff.py baseline current > size-table.md
            cat size-table.md >> "$GITHUB_STEP_SUMMARY"
            echo "${{ github.event.pull_request.number }}" > pr.txt
          fi
      - name: Upload table
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: size-table
          path: |
            size-table.md
            pr.txt
      - name: Upload baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: size-baseline
          path: current/*.json
  build:
    needs:
      - check
    strategy:
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/') }}
      matrix:
        include:
          # Ubuntu x64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: ring
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: aws-lc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: graviola
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: openssl
          # Ubuntu arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: ring
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: aws-lc
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: graviola
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: openssl
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: ring
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: aws-lc
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: graviola
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: openssl
          # Windows x64 (ring, openssl, graviola - no aws-lc)
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: ring
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: openssl
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: graviola
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      crypto: ${{ matrix.crypto }}
  modules:
    needs:
      - check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu x64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: ring
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: aws-lc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: graviola
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: openssl
          # Ubuntu arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: ring
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: aws-lc
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: graviola
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: openssl
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: ring
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: aws-lc
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: graviola
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: openssl
          # Windows x64 (ring, openssl, graviola - no aws-lc)
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: ring
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: openssl
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: graviola
    uses: ./.github/workflows/build-modules.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      crypto: ${{ matrix.crypto }}
