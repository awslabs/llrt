name: Publish crates
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CRATES_IO_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          node: true
          toolchain: stable
      - name: Build JS bundle
        run: make js
        env:
          SDK_BUNDLE_MODE: STD
      - name: Publish crates
        run: ./scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
