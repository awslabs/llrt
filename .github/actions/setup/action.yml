name: LLRT setup
description: Shared toolchain setup for the LLRT workflows

inputs:
  toolchain:
    description: Rust toolchain to install
    required: true
  components:
    description: Rust components to install
    required: false
    default: ""
  target:
    description: Rust target to install
    required: false
    default: ""
  node:
    description: Set up Node.js and install the JavaScript dependencies
    required: false
    default: "false"
  zig:
    description: Install the Zig version pinned in .zig-version
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux' && (inputs.node == 'true' || inputs.zig == 'true')
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -y update
        sudo apt-get -y install make nodejs tzdata-legacy

    - name: Install Zig build dependencies
      if: runner.os == 'Linux' && inputs.zig == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -y install zstd zip lld xz-utils

    - name: Setup Zig
      if: inputs.zig == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=$(cat "$GITHUB_WORKSPACE/.zig-version")
        arch=$(uname -m)
        curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" \
          "https://ziglang.org/download/${version}/zig-${arch}-linux-${version}.tar.xz"
        sudo tar -xf "$RUNNER_TEMP/zig.tar.xz" -C /opt
        echo "/opt/zig-${arch}-linux-${version}" >> "$GITHUB_PATH"
        echo "ZIG_VERSION=$version" >> "$GITHUB_ENV"

    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        cache: yarn
        node-version: lts/*

    - name: Install JavaScript dependencies
      if: inputs.node == 'true'
      shell: bash
      run: |
        corepack enable
        yarn

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.target }}
        cache-bin: false

    - name: Install cargo-zigbuild
      if: inputs.zig == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild
