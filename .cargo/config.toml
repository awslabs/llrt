[target.aarch64-unknown-linux-musl]
rustflags = [
    "-Ctarget-feature=+lse,+crt-static",
    "-Ctarget-cpu=neoverse-n1",
    "-Zunstable-options",
    "-Cpanic=immediate-abort",
    "-Zpanic_abort_tests",
    "-Zthreads=8",
    "-Cforce-unwind-tables=no",
    "-Zlocation-detail=none",
    "-Crelocation-model=static",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-Ctarget-feature=+crt-static",
    "-Ctarget-cpu=haswell",
    "-Zunstable-options",
    "-Cpanic=immediate-abort",
    "-Zpanic_abort_tests",
    "-Zthreads=8",
    "-Cforce-unwind-tables=no",
    "-Zlocation-detail=none",
    "-Crelocation-model=static",
]

[env]
CC_aarch64_apple_darwin = "/usr/bin/clang"
CC_x86_64_apple_darwin = "/usr/bin/clang"
CXX_aarch64_apple_darwin = "/usr/bin/clang"
CXX_x86_64_apple_darwin = "/usr/bin/clang"
CC_x86_64_unknown_linux_musl = "zig cc -target x86_64-linux-musl"
CXX_x86_64_unknown_linux_musl = "zig c++ -target x86_64-linux-musl"
CC_aarch64_unknown_linux_musl = "zig cc -target aarch64-linux-musl"
CXX_aarch64_unknown_linux_musl = "zig c++ -target aarch64-linux-musl"

[unstable]
build-std = ["core", "compiler_builtins", "alloc", "std", "panic_abort"]
