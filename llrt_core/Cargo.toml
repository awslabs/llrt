[package]
name = "llrt_core"
description = "LLRT runtime core"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
include = [
  "src/**",
  "build.rs",
  "sdk.cfg",
  "bundle/js/**",
  "Cargo.toml",
]

[features]
default = ["macro", "tls-ring", "crypto-rust", "pqc"]
lambda = []
no-sdk = ["llrt_modules/no-sdk"]
uncompressed = []
macro = ["rquickjs/macro"]
bindgen = ["rquickjs/bindgen"]

pqc = ["llrt_modules/pqc"]
intl402 = ["llrt_modules/intl402"]

# TLS crypto backend features
tls-rust = ["llrt_modules/tls-rust"]
tls-ring = ["rustls/ring", "llrt_modules/tls-ring"]
tls-aws-lc = ["rustls/aws_lc_rs", "llrt_modules/tls-aws-lc"]
tls-graviola = ["llrt_modules/tls-graviola"]
tls-openssl = ["llrt_modules/tls-openssl", "dep:openssl"]

# Crypto provider features
crypto-rust = ["llrt_modules/crypto-rust"]
crypto-ring = ["llrt_modules/crypto-ring"]
crypto-ring-rust = ["llrt_modules/crypto-ring-rust"]
crypto-graviola = ["llrt_modules/crypto-graviola"]
crypto-graviola-rust = ["llrt_modules/crypto-graviola-rust"]
crypto-openssl = ["llrt_modules/crypto-openssl"]

# OpenSSL vendored (builds OpenSSL from source)
openssl-vendored = ["openssl/vendored"]

[dependencies]
bytes = { version = "1", default-features = false }
home = { version = "0.5", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false }
itoa = { version = "1", default-features = false }
jiff = { version = "1", features = ["std"], default-features = false }
libc = { version = "0.2", default-features = false }
llrt_context = { workspace = true }
llrt_encoding = { workspace = true }
llrt_hooking = { workspace = true }
llrt_json = { workspace = true }
llrt_logging = { workspace = true }
llrt_modules = { workspace = true, default-features = false, features = [
  "base",
  "console",
] }
llrt_net_policy = { workspace = true }
llrt_numbers = { workspace = true }
llrt_utils = { workspace = true, default-features = true, features = ["all"] }
once_cell = { version = "1", features = ["std"], default-features = false }
phf = { version = "0.14", default-features = false }
quick-xml = { version = "0.42", default-features = false }
rand = { version = "0.10", features = [
  "alloc",
  "thread_rng",
], default-features = false }
rquickjs = { version = "0.14", features = [
  "futures",
  "parallel",
  "rust-alloc",
], default-features = false }
rustls = { version = "0.23", features = ["tls12"], default-features = false }
rustls-pemfile = { version = "2", features = ["std"], default-features = false }
ryu = { version = "1", default-features = false }
simd-json = { version = "0.19", default-features = false }
terminal_size = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["sync", "time"], default-features = false }
tracing = { version = "0.1", features = ["log"], default-features = false }
zstd = { version = "0.14", default-features = false }
openssl = { version = "0.10", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
md-5 = { version = "0.11", default-features = false }
[target.'cfg(not(target_os = "windows"))'.dependencies]
md-5 = { version = "0.11", default-features = false }

[build-dependencies]
llrt_build = { workspace = true }
phf_codegen = { version = "0.14", default-features = false }
rquickjs = { version = "0.14", default-features = false }
zstd = { version = "0.14", default-features = false, features = ["zdict_builder"] }
walkdir = { version = "2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
llrt_test = { workspace = true }
rquickjs = { version = "0.14", default-features = false }
wiremock = { version = "0.6", default-features = false }

[[bench]]
name = "codec"
harness = false
