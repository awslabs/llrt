[package]
name = "llrt_tls"
description = "LLRT Module tls"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_tls"
path = "src/lib.rs"

[features]
default = ["webpki-roots", "tls-ring", "encrypted-keys"]

webpki-roots = ["dep:webpki-roots"]
native-roots = ["dep:rustls-native-certs", "dep:tracing"]

# Decrypts encrypted private keys on the rustls backends. OpenSSL decrypts
# them itself, so the OpenSSL backend doesn't use it.
encrypted-keys = ["dep:llrt_pem", "dep:llrt_pbe", "dep:llrt_pkcs8"]

# TLS crypto backend features (rustls-based)
tls-ring = ["dep:rustls", "rustls/ring"]
tls-aws-lc = ["dep:rustls", "rustls/aws_lc_rs"]
tls-graviola = ["dep:rustls", "dep:rustls-graviola"]

# OpenSSL TLS backend
tls-openssl = ["dep:openssl", "dep:hex-simd", "dep:itoa"]

[dependencies]
once_cell = { version = "1", features = ["std"], default-features = false }
rustls = { version = "0.23", features = [
  "std",
  "tls12",
], default-features = false, optional = true }
rustls-graviola = { version = "0.4", default-features = false, optional = true }
openssl = { version = "0.10", optional = true }
hex-simd = { version = "0.8", features = ["alloc"], default-features = false, optional = true }
itoa = { version = "1", default-features = false, optional = true }
webpki-roots = { version = "1", default-features = false, optional = true }
rustls-native-certs = { version = "0.8", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
llrt_pem = { workspace = true, optional = true }
llrt_pbe = { workspace = true, optional = true }
llrt_pkcs8 = { workspace = true, optional = true }

[dev-dependencies]
aes = { version = "0.9", default-features = false }
base64-simd = { version = "0.8", features = ["alloc"], default-features = false }
cbc = { version = "0.2", features = ["block-padding"], default-features = false }
der = { version = "0.8", features = ["oid"], default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
