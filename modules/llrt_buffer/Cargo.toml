[package]
name = "llrt_buffer"
description = "LLRT Module buffer"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_buffer"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
llrt_encoding = { workspace = true }
llrt_stream_web = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", features = [
  "futures",
], default-features = false }
ryu-js = { version = "1", default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["full"], default-features = false }
