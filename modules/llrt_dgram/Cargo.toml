[package]
name = "llrt_dgram"
description = "LLRT Module dgram"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[lib]
name = "llrt_dgram"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
llrt_buffer = { workspace = true }
llrt_context = { workspace = true }
llrt_events = { workspace = true }
llrt_net_policy = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }
tokio = { version = "1", features = [
    "net",
    "macros",
], default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
