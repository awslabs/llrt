[package]
name = "llrt_intl"
description = "LLRT Intl module - minimal internationalization support"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[lib]
name = "llrt_intl"
path = "src/lib.rs"

[dependencies]
itoa = "1.0"
jiff = { version = "1", features = ["std"], default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", features = ["macro"], default-features = false }
