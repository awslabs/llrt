[package]
name = "llrt_abort"
description = "LLRT Module abort"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_abort"
path = "src/lib.rs"

[features]
default = ["sleep-timers"]

sleep-timers = ["llrt_timers"]
sleep-tokio = ["tokio"]

[dependencies]
llrt_exceptions = { workspace = true }
llrt_events = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", default-features = false }

# Optional
llrt_timers = { workspace = true, optional = true }
tokio = { version = "1", features = [
    "time",
], default-features = false, optional = true }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "test-util"], default-features = false }
