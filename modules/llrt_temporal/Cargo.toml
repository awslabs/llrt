[package]
name = "llrt_temporal"
description = "LLRT Module temporal"
version = "0.10.0-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[lib]
name = "llrt_temporal"
path = "src/lib.rs"

[features]
default = []

# Bundle timezone database for rule-based timezone equality; without it, IANA
# timezone identifiers are compared instead.
tzdb = ["dep:jiff-tzdb"]

[dependencies]
jiff = { version = "0.2" }
llrt_utils = { version = "0.10.0-beta", path = "../../libs/llrt_utils", default-features = false }
rquickjs = { version = "0.14", features = ["macro"], default-features = false }

jiff-tzdb = { version = "0.1", optional = true }
