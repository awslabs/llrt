[package]
name = "llrt_temporal"
description = "LLRT Module temporal"
version = "0.10.0-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[lib]
name = "llrt_temporal"
path = "src/lib.rs"

[features]
default = []

# Bundle the time zone database for rule-based equality.
# Without this feature, Temporal equality compares normalized IANA identifiers.
bundled-tzdb = ["dep:jiff-tzdb"]

[dependencies]
jiff = { version = "0.2", features = [
  "std",
  "tz-system",
  "tzdb-bundle-platform",
  "tzdb-concatenated",
  "tzdb-zoneinfo",
  "perf-inline",
], default-features = false }
llrt_utils = { version = "0.10.0-beta", path = "../../libs/llrt_utils", default-features = false }
rquickjs = { version = "0.14", features = ["macro"], default-features = false }

jiff-tzdb = { version = "0.1", optional = true }
