[package]
name = "llrt_temporal"
description = "LLRT Module temporal"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_temporal"
path = "src/lib.rs"

[dependencies]
jiff = { version = "1", features = [
  "std",
  "tz-system",
  "tzdb-bundle-platform",
  "tzdb-concatenated",
  "tzdb-zoneinfo",
  "perf-inline",
], default-features = false }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", features = ["macro"], default-features = false }
