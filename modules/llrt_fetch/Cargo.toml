[package]
name = "llrt_fetch"
description = "LLRT Module fetch"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_fetch"
path = "src/lib.rs"

[features]
default = ["http1", "http2", "compression-c", "webpki-roots", "tls-ring"]

http1 = ["hyper/http1", "llrt_http/http1"]
http2 = ["hyper/http2", "llrt_http/http2"]

compression-c = ["llrt_compression/all-c"]
compression-rust = ["llrt_compression/all-rust"]

webpki-roots = ["llrt_http/webpki-roots"]
native-roots = ["llrt_http/native-roots"]

tls-ring = ["llrt_http/tls-ring", "llrt_test_tls/tls-ring"]
tls-aws-lc = ["llrt_http/tls-aws-lc", "llrt_test_tls/tls-aws-lc"]
tls-graviola = ["llrt_http/tls-graviola", "llrt_test_tls/tls-graviola"]
tls-openssl = ["llrt_http/tls-openssl", "llrt_test_tls/tls-openssl"]

[dependencies]
bytes = { version = "1", default-features = false }
either = { version = "1", default-features = false }
http-body = { version = "1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", features = ["client"], default-features = false }
hyper-util = { version = "=0.1.21", features = ["client-legacy"], default-features = false }
itoa = { version = "1", default-features = false }
llrt_abort = { workspace = true }
llrt_buffer = { workspace = true }
llrt_compression = { workspace = true, default-features = false }
llrt_context = { workspace = true }
llrt_encoding = { workspace = true }
llrt_http = { workspace = true, default-features = false }
llrt_json = { workspace = true }
llrt_net_policy = { workspace = true }
llrt_url = { workspace = true }
url = { version = "2", features = ["std"], default-features = false }
llrt_utils = { workspace = true, default-features = false }
llrt_stream_web = { workspace = true }
once_cell = { version = "1", features = ["std"], default-features = false }
pin-project-lite = { version = "0.2", default-features = false }
percent-encoding = { version = "2", features = [
  "std",
], default-features = false }
sha2 = { version = "0.11", default-features = false }
rand = { version = "0.10", features = [
  "std",
  "thread_rng",
], default-features = false }
rquickjs = { version = "0.14", default-features = false }
simdutf8 = { version = "0.1", default-features = false, features = ["std", "aarch64_neon"] }
tokio = { version = "1", features = [
  "macros",
  "sync",
], default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
llrt_compression = { workspace = true, default-features = true }
llrt_test = { workspace = true }
llrt_test_tls = { workspace = true, default-features = false }
wiremock = { version = "0.6", default-features = false }
