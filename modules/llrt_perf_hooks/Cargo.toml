[package]
name = "llrt_perf_hooks"
description = "LLRT Module perf_hooks"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_perf_hooks"
path = "src/lib.rs"

[dependencies]
llrt_events = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
