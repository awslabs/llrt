[package]
name = "llrt_dns"
description = "LLRT Module dns"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_dns"
path = "src/lib.rs"

[dependencies]
either = { version = "1", default-features = false }
llrt_context = { workspace = true }
llrt_hooking = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", features = [
  "macro",
  "either",
], default-features = false }
tokio = { version = "1", features = ["net"], default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = [
  "macros",
  "test-util",
], default-features = false }
