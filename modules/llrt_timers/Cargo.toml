[package]
name = "llrt_timers"
description = "LLRT Module timers"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_timers"
path = "src/lib.rs"

[dependencies]
llrt_scheduler = { version = "0.9.0-beta", path = "../../libs/llrt_scheduler" }
llrt_utils = { version = "0.9.0-beta", path = "../../libs/llrt_utils", default-features = false }
rquickjs = { version = "0.14", default-features = false }

[dev-dependencies]
llrt_test = { path = "../../libs/llrt_test" }
tokio = { version = "1", features = ["macros", "rt"], default-features = false }
