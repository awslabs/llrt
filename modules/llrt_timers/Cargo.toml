[package]
name = "llrt_timers"
description = "LLRT Module timers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_timers"
path = "src/lib.rs"

[dependencies]
llrt_context = { workspace = true }
llrt_hooking = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }
tokio = { version = "1", features = [
  "macros",
  "sync",
  "time",
], default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
