[package]
name = "llrt_zlib"
description = "LLRT Module zlib"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_zlib"
path = "src/lib.rs"

[features]
default = ["compression-c"]

compression-c = [
  "llrt_compression/brotli-c",
  "llrt_compression/flate2-c",
  "llrt_compression/zstd-c",
]

compression-rust = [
  "llrt_compression/brotli-rust",
  "llrt_compression/flate2-rust",
  "llrt_compression/zstd-rust",
]

[dependencies]
llrt_buffer = { workspace = true }
llrt_compression = { workspace = true, default-features = false }
llrt_context = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", features = ["std"], default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
