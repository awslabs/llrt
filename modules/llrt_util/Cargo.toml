[package]
name = "llrt_util"
description = "LLRT Module util"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_util"
path = "src/lib.rs"

[dependencies]
llrt_context = { workspace = true }
llrt_encoding = { workspace = true }
llrt_logging = { workspace = true }
llrt_stream_web = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["macros", "test-util"], default-features = false }
