[package]
name = "llrt_url"
description = "LLRT Module url"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_url"
path = "src/lib.rs"

[dependencies]
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", default-features = false }
url = { version = "2", features = ["std"], default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "test-util"], default-features = false }
