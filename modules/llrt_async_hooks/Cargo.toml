[package]
name = "llrt_async_hooks"
description = "LLRT Module async_hooks"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_async_hooks"
path = "src/lib.rs"

[dependencies]
llrt_async_context = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { version = "0.14", default-features = false }
smallvec = { version = "1", default-features = false }
