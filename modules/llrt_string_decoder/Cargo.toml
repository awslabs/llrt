[package]
name = "llrt_string_decoder"
description = "LLRT Module string_decoder"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_string_decoder"
path = "src/lib.rs"

[dependencies]
llrt_buffer = { workspace = true }
llrt_encoding = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "test-util"], default-features = false }
