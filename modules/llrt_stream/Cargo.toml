[package]
name = "llrt_stream"
description = "LLRT Module stream"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_stream"
path = "src/lib.rs"

[dependencies]
llrt_buffer = { workspace = true }
llrt_context = { workspace = true }
llrt_events = { workspace = true }
llrt_utils = { workspace = true, features = [
  "bytearray-buffer",
], default-features = false }
rquickjs = { version = "0.14", features = ["std"], default-features = false }
tokio = { version = "1", features = [
  "macros",
  "io-util",
], default-features = false }
