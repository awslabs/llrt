[package]
name = "llrt_json"
description = "LLRT json helpers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_json"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
llrt_utils = { workspace = true, default-features = false }
memchr = { version = "2", default-features = false }
rquickjs = { version = "0.14", default-features = false }
ryu = { version = "1", default-features = false }
simd-json = { version = "0.19", features = [
    "big-int-as-float",
], default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
llrt_test = { workspace = true }
tokio = { version = "1", features = ["test-util", "macros"], default-features = false }

[build-dependencies]
llrt_build = { workspace = true }

[[bench]]
name = "json"
harness = false
