[package]
name = "llrt_encoding"
description = "LLRT encoding helpers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[dependencies]
base64-simd = { version = "0.8", features = [
    "alloc",
], default-features = false }
hex-simd = { version = "0.8", features = ["alloc"], default-features = false }
phf = { version = "0.14", features = ["macros"], default-features = false }
memchr = { version = "2", default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }

[build-dependencies]
llrt_build = { workspace = true }
