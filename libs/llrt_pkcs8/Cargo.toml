[package]
name = "llrt_pkcs8"
description = "LLRT encrypted PKCS#8 private keys"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_pkcs8"
path = "src/lib.rs"

[dependencies]
der = { version = "0.8", features = ["derive"], default-features = false }
llrt_pbe = { workspace = true }

[dev-dependencies]
llrt_pem = { workspace = true }
