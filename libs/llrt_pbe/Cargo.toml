[package]
name = "llrt_pbe"
description = "LLRT password-encrypted private keys (PEM, PKCS#8, PBES2)"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_pbe"
path = "src/lib.rs"

[features]
default = ["hmac-sha1", "hmac-sha2", "hmac-sha3", "hmac-md5"]

# PBKDF2 PRFs. A key whose PRF is off fails with Error::Unimplemented.
hmac-sha1 = ["dep:sha1"]
hmac-sha2 = ["dep:sha2"]
hmac-sha3 = ["dep:sha3"]
hmac-md5 = ["dep:md-5"]

[dependencies]
aes = { version = "0.9", default-features = false }
base64-simd = { version = "0.8", features = ["alloc"], default-features = false }
cbc = { version = "0.2", features = ["block-padding"], default-features = false }
der = { version = "0.8", features = ["derive", "oid"], default-features = false }
hmac = { version = "0.13", default-features = false }
md-5 = { version = "0.11", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false }
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
sha3 = { version = "0.12", default-features = false, optional = true }

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }
