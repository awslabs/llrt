[package]
name = "llrt_logging"
description = "LLRT logging helpers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_logging"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
llrt_json = { workspace = true }
llrt_numbers = { workspace = true }
llrt_utils = { workspace = true, default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", default-features = false }
ryu = { version = "1", default-features = false }
