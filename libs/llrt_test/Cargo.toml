[package]
name = "llrt_test"
description = "LLRT test helpers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_test"
path = "src/lib.rs"

[dependencies]
rquickjs = { git = "https://github.com/DelSkayn/rquickjs", rev = "fb26457c74d0e05074ed71e94bb3f6cdc2244249", features = [
  "futures",
  "loader",
  "parallel",
], default-features = false }
tokio = { version = "1", features = ["fs"], default-features = false }
uuid = { version = "1", features = ["v4"], default-features = false }
