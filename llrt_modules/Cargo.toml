[package]
name = "llrt_modules"
description = "LLRT Modules for rquickjs"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[features]
default = ["base", "console", "tls-ring", "crypto-rust", "pqc"]
lambda = ["base"]
no-sdk = ["llrt_process?/no-sdk"]

pqc = ["llrt_crypto?/pqc"]
intl402 = ["intl", "temporal"]

# TLS crypto backend features
tls-ring = ["llrt_http?/tls-ring", "llrt_tls?/tls-ring", "llrt_fetch?/tls-ring"]
tls-aws-lc = [
  "llrt_http?/tls-aws-lc",
  "llrt_tls?/tls-aws-lc",
  "llrt_fetch?/tls-aws-lc",
]
tls-graviola = [
  "llrt_http?/tls-graviola",
  "llrt_tls?/tls-graviola",
  "llrt_fetch?/tls-graviola",
]
tls-openssl = ["llrt_http?/tls-openssl", "llrt_tls?/tls-openssl"]

# Crypto provider features
crypto-rust = ["llrt_crypto?/crypto-rust"]
crypto-ring = ["llrt_crypto?/crypto-ring"]
crypto-ring-rust = ["llrt_crypto?/crypto-ring-rust"]
crypto-graviola = ["llrt_crypto?/crypto-graviola"]
crypto-graviola-rust = ["llrt_crypto?/crypto-graviola-rust"]
crypto-openssl = ["llrt_crypto?/crypto-openssl"]

# OpenSSL vendored (builds OpenSSL from source)
openssl-vendored = ["dep:openssl", "openssl/vendored"]

base = [
  "abort",
  "assert",
  "async-hooks",
  "buffer",
  "child-process",
  "crypto",
  "dgram",
  "dns",
  "events",
  "exceptions",
  "fetch",
  "fs",
  "https",
  "navigator",
  "net",
  "os",
  "path",
  "perf-hooks",
  "process",
  "stream-web",
  "string-decoder",
  "timers",
  "tls",
  "tty",
  "url",
  "util",
  "zlib",
]


# Modules
abort = ["llrt_abort"]
assert = ["llrt_assert"]
async-hooks = ["llrt_async_hooks"]
buffer = ["llrt_buffer"]
child-process = ["llrt_child_process"]
console = ["llrt_console"]
crypto = ["llrt_crypto"]
dgram = ["llrt_dgram"]
dns = ["llrt_dns"]
events = ["llrt_events"]
exceptions = ["llrt_exceptions"]
fetch = [
  "llrt_fetch",
  "llrt_fetch?/http1",
  "llrt_fetch?/http2",
  "llrt_fetch?/compression-c",
  "llrt_fetch?/webpki-roots",
]
compression-c = ["llrt_fetch?/compression-c", "llrt_zlib?/compression-c"]
compression-rust = [
  "llrt_fetch?/compression-rust",
  "llrt_zlib?/compression-rust",
]
fs = ["llrt_fs"]
https = [
  "llrt_http",
  "llrt_http?/webpki-roots",
  "llrt_http?/http1",
  "llrt_http?/http2",
]
intl = ["llrt_intl"]
navigator = ["llrt_navigator"]
net = ["llrt_net"]
os = ["llrt_os"]
path = ["llrt_path"]
process = ["llrt_process"]
perf-hooks = ["llrt_perf_hooks"]
stream-web = ["llrt_stream_web"]
string-decoder = ["llrt_string_decoder"]
temporal = ["llrt_temporal"]
timers = ["llrt_timers"]
tls = ["llrt_tls"]
tty = ["llrt_tty"]
url = ["llrt_url"]
util = ["llrt_util"]
zlib = ["llrt_zlib"]

[dependencies]
home = { version = "0.5", default-features = false }
llrt_hooking = { workspace = true }
llrt_json = { workspace = true }
llrt_utils = { workspace = true, default-features = true }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "0.14", features = ["loader"], default-features = false }
simd-json = { version = "0.19", default-features = false }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }

# Optional
llrt_abort = { workspace = true, optional = true }
llrt_assert = { workspace = true, optional = true }
llrt_async_hooks = { workspace = true, optional = true }
llrt_buffer = { workspace = true, optional = true }
llrt_child_process = { workspace = true, optional = true }
llrt_console = { workspace = true, optional = true }
llrt_crypto = { workspace = true, default-features = false, optional = true }
llrt_dgram = { workspace = true, optional = true }
llrt_dns = { workspace = true, optional = true }
llrt_events = { workspace = true, optional = true }
llrt_exceptions = { workspace = true, optional = true }
llrt_fetch = { workspace = true, default-features = false, optional = true }
llrt_fs = { workspace = true, optional = true }
llrt_http = { workspace = true, default-features = false, optional = true }
llrt_intl = { workspace = true, optional = true }
llrt_navigator = { workspace = true, optional = true }
llrt_net = { workspace = true, optional = true }
llrt_os = { workspace = true, default-features = false, optional = true }
llrt_path = { workspace = true, optional = true }
llrt_process = { workspace = true, optional = true }
llrt_perf_hooks = { workspace = true, optional = true }
llrt_stream_web = { workspace = true, optional = true }
llrt_string_decoder = { workspace = true, optional = true }
llrt_temporal = { workspace = true, optional = true }
llrt_timers = { workspace = true, optional = true }
llrt_tls = { workspace = true, default-features = false, optional = true }
llrt_tty = { workspace = true, optional = true }
llrt_url = { workspace = true, optional = true }
openssl = { version = "0.10", optional = true }
llrt_util = { workspace = true, optional = true }
llrt_zlib = { workspace = true, optional = true }

[dev-dependencies]
llrt_test = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
